<!DOCTYPE html>
<html lang="en">
  <!-- prettier-ignore -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the portfolio of Emir WebDevs., contact me for any inquiries." />
    <meta name="keywords" content="web developer, web designer, portfolio, Emir WebDevs, modern web portfolio, web development, web design, web solutions, web services, contact me, contact page">
    
    <meta property="og:title" content="Emir WebDevs | Web Developer & Designer Portfolio">
    <meta property="og:description" content="Showcasing the projects and skills of Emir WebDevs, a dedicated web professional. contact me for any inquiries.">
    <meta property="og:image" content="URL_to_image">
    <meta property="og:url" content="https://emir-portfolio.pages.dev">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Emir WebDevs | Web Developer & Designer Portfolio">
    <meta name="twitter:description" content="Discover the work of Emir WebDevs, specializing in web development and design. contact me for any inquiries.">
    <meta name="twitter:image" content="URL_to_image">

    <link rel="apple-touch-icon" sizes="180x180" href="../m-images/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../m-images/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../m-images/favicon/favicon-16x16.png">
    <link rel="manifest" href="../m-images/favicon/site.webmanifest">

    <title>Emir Portfolio - Contact</title>
    <link rel="stylesheet" href="c-style.css" />
    <link rel="stylesheet" href="c-res.css" />

    <link rel="stylesheet" href="../!getMainItems/!getMainItems.css" />
    <script src="https://kit.fontawesome.com/00106cbec8.js" crossorigin="anonymous"></script>

    <style>
      .hyperlinks a:first-of-type {
        color: #6e6e6e;
      }
      .hyperlinks a:nth-child(4) {
        color: var(--cMain);
      }
    </style>
  </head>
  <body>
    <!---------------------- NAV ------------------------>
    <div id="nav-container"></div>

    <!---------------------- CONTAINER ------------------------>
    <div class="container">
      <section id="main_content">
        <div id="profileCard-container"></div>

        <!---------------------- CONTACT CARD ------------------------>
        <aside id="contact-card">
          <h1>CONTACT ME</h1>

          <form action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="0d1afcb1-f540-46ff-870d-9ee3dbb499cc" />

            <div class="input-container">
              <input type="text" name="name" class="input_type" required />
              <label class="floating-label">Full name</label>
            </div>

            <div class="input-container">
              <input type="email" name="email" class="input_type" required />
              <label class="floating-label">Email</label>
            </div>

            <div class="input-container">
              <input type="text" name="subject" class="input_type" required />
              <label class="floating-label">Subject</label>
            </div>

            <div class="input-container">
              <textarea
                name="message"
                id="dinamicTextarea"
                class="input_type"
                placeholder="Your message..."
                required
              ></textarea>
            </div>

            <input type="checkbox" name="botcheck" class="hidden" style="display: none" />

            <!-- Custom Confirmation / Success Page -->
            <input type="hidden" name="redirect" value="../f-contact/thanks.html" />

            <button type="submit">Submit Form</button>
          </form>
        </aside>
      </section>
      <!---------------------- FOOTER ------------------------>

      <div id="footer-container"></div>
    </div>

    <!-- SCRIPT -->
    <script src="../!getMainItems_fetch.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const textarea = document.getElementById("dinamicTextarea");

        function autoResize() {
          textarea.style.height = "40px";
          textarea.style.height = textarea.scrollHeight + "px";
        }

        textarea.addEventListener("input", autoResize);
      });

      document.addEventListener("DOMContentLoaded", function () {
        const inputs = document.querySelectorAll(".input_type");

        inputs.forEach((input) => {
          input.addEventListener("input", function () {
            if (this.value.trim() !== "") {
              this.classList.add("filled");
            } else {
              this.classList.remove("filled");
            }
          });
        });
      });
    </script>
  </body>
</html>
